<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd"> 
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:h="http://java.sun.com/jsf/html"> 

<h:head>
	<title>Gerenciamento de Encomendas</title>

	<h:outputStylesheet library="css" name="default.css" />
	<h:outputStylesheet library="css" name="gerenciadores.css" />
</h:head>

<body>

	<div id="conteudo">
		<h1 class="titulo-pagina">Gerenciador de Encomendas</h1>

		<h:messages styleClass="mensagens"/>

		<h:form>
			<h:commandLink
			 action="index?faces-redirect=true"
			 styleClass="botao botao-voltar"
			 value="Voltar para tela inicial" />
		</h:form>

		<div class="painel">
			<h2 class="subtitulo">Insira as informações das encomendas</h2>
			<h:form>
				<div class="grade-formulario">
					<h:outputLabel value="Codigo de Rastreio:" />
					<h:inputText required="true" value="#{encomendaBean.encomenda.codigoRastreio}" requiredMessage="Código de Rastreio não inserido."/>

					<h:outputLabel value="Valor:" />
					<h:inputText required="true" value="#{encomendaBean.encomenda.valor}" requiredMessage="Valor não inserido."/>

					<h:outputLabel value="Cliente:" />
					<h:selectOneMenu required="true" value="#{encomendaBean.idCliente}" requiredMessage="Cliente não inserido.">
						<f:selectItem itemValue="" itemLabel="Selecione..." />
						<f:selectItems value="#{encomendaBean.clientes}" var="cliAtual"
							itemLabel="#{cliAtual.nome}" itemValue="#{cliAtual.id}" />
					</h:selectOneMenu>

					<h:outputLabel value="Entregador:" />
					<h:selectOneMenu required="true" value="#{encomendaBean.idEntregador}" requiredMessage="Entregador não inserido">
						<f:selectItem itemValue="" itemLabel="Selecione..." />
						<f:selectItems value="#{encomendaBean.entregadores}" var="entrAtual"
							itemLabel="#{entrAtual.nome}" itemValue="#{entrAtual.id}" />
					</h:selectOneMenu>
				</div>

				<h:panelGroup layout="block" styleClass="acoes-formulario">
					<h:commandButton styleClass="botao" action="#{encomendaBean.gravar()}" value="Gravar" />
				</h:panelGroup>
			</h:form>
		</div>

		<div class="painel">
			<h2 class="subtitulo">Encomendas Cadastradas</h2>
			<h:form>
				<h:dataTable border="0" value="#{encomendaBean.encomendas}" var="encoAtual" styleClass="tabela">
					<h:column>
						<f:facet name="header">Código de Rastreio</f:facet>
						<h:outputText value="#{encoAtual.codigoRastreio}" />
					</h:column>
					<h:column>
						<f:facet name="header">Valor</f:facet>
						<h:outputText value="#{encoAtual.valor}" />
					</h:column>
					<h:column>
						<f:facet name="header">Cliente</f:facet>
						<h:outputText value="#{encoAtual.cliente.nome}" />
					</h:column>
					<h:column>
						<f:facet name="header">Número da residência</f:facet>
						<h:outputText value="#{encoAtual.cliente.endereco.numero}" />
					</h:column>
					<h:column>
						<f:facet name="header">Rua</f:facet>
						<h:outputText value="#{encoAtual.cliente.endereco.rua}" />
					</h:column>
					<h:column>
						<f:facet name="header">Bairro</f:facet>
						<h:outputText value="#{encoAtual.cliente.endereco.bairro}" />
					</h:column>
					<h:column>
						<f:facet name="header">Cidade</f:facet>
						<h:outputText value="#{encoAtual.cliente.endereco.cidade}" />
					</h:column>
					<h:column>
						<f:facet name="header">Entregador</f:facet>
						<h:outputText value="#{encoAtual.entregador.nome}" />
					</h:column>
					<h:column>
						<f:facet name="header">Ações</f:facet>
						<h:panelGroup layout="block" styleClass="acoes">
							<h:commandButton styleClass="botao"
								action="#{encomendaBean.excluirEncomenda(encoAtual)}" value="Excluir" />
							<h:commandButton styleClass="botao"
								action="#{encomendaBean.carregarEncomenda(encoAtual)}" value="Editar" />
						</h:panelGroup>
					</h:column>
				</h:dataTable>
			</h:form>
		</div>
	</div>
</body>
</html>
